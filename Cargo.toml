[package]
name = "timezone-picker"
version = "0.1.0"
edition = "2021"

# Produce the smallest reasonable standalone exe.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
regex = "1"
once_cell = "1"

# windows-rs: only pull in the specific API families we use, to keep build
# times and binary size down.
[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
]

[[bin]]
name = "timezone-picker"
path = "src/main.rs"

# This makes it a GUI app (no console window pops up on launch).
[package.metadata.winres]
