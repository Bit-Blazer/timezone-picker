[package]
name = "timezone-picker"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.6.1"
chrono = "0.4.45"
chrono-english = "0.1.8"
chrono-tz = "0.10.4"
iana-time-zone = "0.1.65"
once_cell = "1.21.4"
regex = "1.13.1"
tray-item = "0.10.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_Globalization", "Graphics_Imaging", "Storage_Streams", "Media_Ocr", "Globalization", "Win32_System_WinRT", "Win32_System_Variant", "Foundation", "Win32_Graphics_Dwm", "Win32_UI_Shell"] }
windows-future = "0.3.2"
winreg = "0.56.0"

[dev-dependencies]
arboard = "3.6.1"
enigo = "0.6.1"

# Produce the smallest reasonable standalone exe.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "timezone-picker"
path = "src/main.rs"

# This makes it a GUI app (no console window pops up on launch).
[package.metadata.winres]

[build-dependencies]
winres = "0.1"
