name: Build Windows exe

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}   # lets you click "Run workflow" manually too

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build (release)
        run: cargo build --release

      - name: Run parser unit tests
        run: cargo test

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: timezone-picker-windows
          path: target/release/timezone-picker.exe
